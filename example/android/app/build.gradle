plugins {
    id("com.android.application")
    id("kotlin-android")
    id("com.facebook.react")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "truvideoreactvideosdk.example"
    defaultConfig {
        applicationId "truvideoreactvideosdk.example"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        // Enable multidex to support large number of methods
        multiDexEnabled true
        
        // Explicitly set newArchEnabled based on gradle.properties to ensure BuildConfig matches
        // This prevents issues where the React Native Gradle plugin might not read the property correctly
        // Read the property directly from gradle.properties to ensure we get the correct value
        def newArchEnabled = project.hasProperty("newArchEnabled") && project.property("newArchEnabled") == "true" ||
                            rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "${newArchEnabled}"
        
        // Log the value for debugging
        println "MainApplication BuildConfig.IS_NEW_ARCHITECTURE_ENABLED will be set to: ${newArchEnabled}"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    packaging {
        // Ensure kotlin-stdlib is included in the APK
        resources {
            pickFirsts += ['**/kotlin-stdlib*.jar', '**/kotlin-stdlib-jdk*.jar']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Kotlin stdlib 2.1.0+ required for kotlin.time.Clock.System and other time APIs
    // Explicitly add as implementation to ensure it's included in the APK
    // The resolutionStrategy in build.gradle will force this version across all dependencies
    // IMPORTANT: Add kotlin-stdlib FIRST to ensure it gets priority in DEX merging
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlinVersion}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlinVersion}"
    
    // Kodein DI dependencies required by Truvideo SDK
    // Using version 7.30.0 which includes the importAll method required by the SDK
    implementation "org.kodein.di:kodein-di:7.30.0"
    implementation "org.kodein.di:kodein-di-framework-android-x:7.30.0"
    
    // Explicitly add the local truvideo-react-video-sdk module
    implementation project(':truvideo-react-video-sdk')
}

// Autolinking is handled by the React Native settings plugin in settings.gradle
// apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Exclude the duplicate trunpm_truvideo-react-video-sdk project from node_modules
// to prevent duplicate BuildConfig class errors when using local development setup
afterEvaluate {
    // Remove the duplicate project dependency if it exists
    project.configurations.all { config ->
        config.dependencies.removeAll { dep ->
            if (dep instanceof ProjectDependency) {
                def projectPath = dep.dependencyProject.path
                return projectPath == ':trunpm_truvideo-react-video-sdk'
            }
            return false
        }
    }
}

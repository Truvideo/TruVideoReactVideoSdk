buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["TruVideoReactVideoSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
     // Add this specific repository for FFmpegKit
        maven { url 'https://packages.arthenica.com/snapshots' }

        // Also add these for broader search
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TruVideoReactVideoSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TruVideoReactVideoSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.truvideoreactvideosdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  kotlinOptions {
    freeCompilerArgs += ['-Xskip-metadata-version-check']
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

configurations.all {
  resolutionStrategy {
    // Force Kotlin stdlib 2.1.0+ for Clock.System support
    force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
  }
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  // Kotlin stdlib 2.1.0+ required for Clock.System support
  // Use api to ensure consumers get the correct Kotlin stdlib version transitively
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  api "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
  api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
  // Exclude any kotlin-stdlib from Truvideo SDK to ensure our version is used
  implementation("com.github.Truvideo:truvideo-sdk-android-video:79.1.4") {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
  }
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'com.russhwolf:multiplatform-settings:1.1.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.4.1'
  implementation 'androidx.activity:activity:1.9.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'com.google.code.gson:gson:2.10.1'
  // Kodein DI dependencies required by Truvideo SDK
  // Using api to ensure consumers of this SDK also get these dependencies transitively
  // Using version 7.30.0 which includes the importAll method required by the SDK
  api "org.kodein.di:kodein-di:7.30.0"
  api "org.kodein.di:kodein-di-framework-android-x:7.30.0"
}

